spring.application.name=repair-service

#spring.config.import=optional:file:../../.env[.properties]
spring.config.import=file:./.env[.properties]

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:root}
spring.rabbitmq.password=${RABBITMQ_PASS:root}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${REPAIR_DB_NAME:repair}
spring.datasource.username=${REPAIR_DB_USER:repair}
spring.datasource.password=${REPAIR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.open-in-view=false
spring.jpa.flyway.enable=true
spring.flyway.locations=classpath:db/migration